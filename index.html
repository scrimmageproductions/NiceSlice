<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice Slice - Find Your Perfect Pizza</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places"></script>
</head>
<body>
    <header>
        <h1>Nice Slice</h1>
        <p>Find local pizzerias with a swipe!</p>
    </header>
    <div class="location-input">
        <input type="text" id="location" placeholder="Enter city or zip code">
        <button onclick="updateLocation()">Search</button>
    </div>
    <div class="swipe-container">
        <div id="card-stack"></div>
        <div class="swipe-actions">
            <button onclick="swipeLeft()">👎 Pass</button>
            <button onclick="swipeRight()">🍕 Like</button>
        </div>
    </div>
    <div id="map"></div>
    <div class="preferences">
        <h2>Your Preferences</h2>
        <label><input type="checkbox" id="indoor-seating" checked> Indoor Seating</label>
        <label><input type="checkbox" id="outdoor-seating"> Outdoor Seating</label>
        <label><input type="checkbox" id="reservations"> Reservations Available</label>
        <label>Max Price: <input type="range" id="max-price" min="5" max="30" value="20"> $<span id="price-value">20</span></label>
